<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="./src/favicon.png">
  <title>Lista de Produtos</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f6fa;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 10px 0;
    }

    .topo {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      padding: 10px;
      width: 300px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .filtros label {
      margin-right: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .tabela-container {
      flex: 1;
      overflow-y: auto;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    th {
      position: sticky;
      top: 0;
      background: #fafafa;
      z-index: 2;
      text-align: left;
    }

    th:nth-child(1), td:nth-child(1) {
      width: 25%;
    }

    th:nth-child(2), td:nth-child(2) {
      width: 75%;
    }

    .original { background-color: #e6f4ea; }
    .compativel { background-color: #f1f3f5; }
    .remanufaturado { background-color: #fff8e1; }

    .badge {
      margin-left: 10px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: #fff;
    }

    .badge.original { background: #28a745; }
    .badge.compativel { background: #6c757d; }
    .badge.remanufaturado { background: #ffc107; color: #000; }

    tr {
      transition: background 0.2s;
    }

    tr:hover {
      background: #f9f9f9;
    }

    .copy-btn {
      margin-right: 8px;
      color: #555;
      font-size: 14px;
    }

    .codigo-cell {
      cursor: pointer;
    }

    /* animação */
    .copiado td {
      animation: piscar 0.5s ease;
    }

    @keyframes piscar {
      0%   { background-color: #ff3b3b; }
      50%  { background-color: #ff6666; }
      100% { background-color: inherit; }
    }

    .selecionado {
      outline: 2px solid #4dabf7;
    }

    .tabela-container::-webkit-scrollbar {
      width: 8px;
    }

    .tabela-container::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="container">

  <h2>Buscar Produto</h2>

  <div class="topo">
    <input type="text" id="busca" placeholder="Digite código ou nome...">

    <div class="filtros">
      <label><input type="checkbox" value="original" checked> Original</label>
      <label><input type="checkbox" value="compativel" checked> Compatível</label>
      <label><input type="checkbox" value="remanufaturado" checked> Remanufaturado</label>
    </div>
  </div>

  <div class="tabela-container">
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Nome</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>

</div>

<script>
  let dados = [];
  let indiceSelecionado = -1;

  async function carregarDados() {
    try {
      const res = await fetch("https://raw.githubusercontent.com/SupTecJetSer/_/refs/heads/main/dados.json?nocache=" + Date.now());
      dados = await res.json();
      renderizar();
    } catch (erro) {
      console.error("Erro ao carregar JSON:", erro);
    }
  }

  function copiarCodigo(codigo, el) {
    navigator.clipboard.writeText(codigo);

    const icon = el.querySelector('.copy-btn');
    const linha = el.closest('tr');

    if (el._copyTimeout) {
      clearTimeout(el._copyTimeout);
    }

    if (icon) {
      icon.innerHTML = "✔️";

      el._copyTimeout = setTimeout(() => {
        icon.innerHTML = "";
      }, 1500);
    }

    if (linha) {
      linha.classList.remove('copiado');
      void linha.offsetWidth;
      linha.classList.add('copiado');
    }
  }

  function getTiposSelecionados() {
    return Array.from(document.querySelectorAll('.filtros input:checked'))
      .map(el => el.value);
  }

  function atualizarSelecao(linhas) {
    linhas.forEach(l => l.classList.remove('selecionado'));

    if (linhas[indiceSelecionado]) {
      linhas[indiceSelecionado].classList.add('selecionado');
      linhas[indiceSelecionado].scrollIntoView({ block: "nearest" });
    }
  }

  document.addEventListener('keydown', function(e) {
    const linhas = document.querySelectorAll('#tabela tr');

    if (!linhas.length) return;

    if (e.key === "ArrowDown") {
      e.preventDefault();
      indiceSelecionado = Math.min(indiceSelecionado + 1, linhas.length - 1);
      atualizarSelecao(linhas);
    }

    if (e.key === "ArrowUp") {
      e.preventDefault();
      indiceSelecionado = Math.max(indiceSelecionado - 1, 0);
      atualizarSelecao(linhas);
    }

    if (e.key === "Enter" && indiceSelecionado >= 0) {
      const linha = linhas[indiceSelecionado];
      const celula = linha.querySelector('.codigo-cell');
      if (celula) celula.click();
    }
  });

  function renderizar() {
    const termo = document.getElementById('busca').value.toLowerCase();
    const tiposSelecionados = getTiposSelecionados();

    const filtrados = dados.filter(item => {
      const matchBusca =
        item.codigo.toLowerCase().includes(termo) ||
        item.nome.toLowerCase().includes(termo);

      const matchTipo = tiposSelecionados.includes(item.tipo);

      return matchBusca && matchTipo;
    });

    const tabela = document.getElementById('tabela');
    tabela.innerHTML = '';

    filtrados.forEach(item => {
      tabela.innerHTML += `
        <tr class="${item.tipo}">
          <td class="codigo-cell" onclick="copiarCodigo('${item.codigo}', this)">
            <span class="copy-btn"></span>
            ${item.codigo}
          </td>
          <td>
            ${item.nome}
            <span class="badge ${item.tipo}">
              ${item.tipo}
            </span>
          </td>
        </tr>
      `;
    });

    indiceSelecionado = -1;
  }

  document.getElementById('busca').addEventListener('input', renderizar);
  document.querySelectorAll('.filtros input')
    .forEach(el => el.addEventListener('change', renderizar));

  carregarDados();
</script>

</body>
</html>
