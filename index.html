<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="src/favicon.png">
  <title>Lista de Produtos</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>

<div class="container">

  <h2>Buscar Produto</h2>

  <div class="topo">
    <input type="text" id="busca" class="easter-egg" placeholder="Digite código ou nome..." pattern="^((?!Yasmin).)*$">

    <div class="filtros">
      <label><input type="checkbox" value="original" checked> Original</label>
      <label><input type="checkbox" value="compativel" checked> Compatível</label>
      <label><input type="checkbox" value="sulfite" checked> Sulfite</label>
    </div>
  </div>

  <div class="tabela-container">
    <table>
      <thead>
        <tr>
          <th onclick="ordenarPor('codigo')" data-label="Código">Código</th>
          <th onclick="ordenarPor('nome')" data-label="Nome">Nome</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>

</div>

<script src="src/script.js"></script>

</body>
</html>
